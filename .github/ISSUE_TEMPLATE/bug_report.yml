name: Bug report
description: Report reproducible behavior using synthetic data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include fax documents, medical information, credentials, account identifiers, phone numbers, email addresses, or deployment domains.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Give the smallest demo-mode reproduction with synthetic values.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options:
        - Demo
        - SignalWire
        - Sinch
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Data check
      options:
        - label: I removed personal data, documents, credentials, and deployment identifiers.
          required: true
