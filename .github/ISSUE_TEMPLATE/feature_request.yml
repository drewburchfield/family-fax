name: Feature request
description: Propose a focused improvement for a self-hosted household fax app.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What household fax task is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful behavior and any billing or privacy impact.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Project fit
      options:
        - label: This keeps the product self-hosted and single-household.
          required: true
